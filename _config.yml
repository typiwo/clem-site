title: Clem
description: A 0-100 grocery score computed by code, not AI, with a personal verdict for your diet. Free on iPhone.
url: https://clemapp.com
markdown: kramdown
permalink: /:title/

exclude:
  - README.md
  - LAUNCH-OPS.md
  - DESIGN.md
  - SITE-REFRESH-BRIEF.md

# Jekyll skips dotfiles by default. Apple reads the universal-link file for the pilot
# join link (clemapp.com/join?c=<code>) at exactly /.well-known/apple-app-site-association.
include:
  - .well-known

defaults:
  - scope:
      path: ""
    values:
      layout: default
